name: One-use deep-scan repair reconciliation

on:
  push:
    branches:
      - agent/reconcile-deep-scan-repairs-20260810
    paths:
      - .github/workflows/reconcile-deep-scan-repairs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-deep-scan-repairs
  cancel-in-progress: false

jobs:
  reconcile-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the dedicated reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reconcile-deep-scan-repairs-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Apply exact-head and evidence reconciliation
        run: python .github/scripts/reconcile_deep_scan_repairs.py

      - name: Remove one-use reconciliation assets
        run: |
          rm -f .github/scripts/reconcile_deep_scan_repairs.py
          rm -f .github/workflows/reconcile-deep-scan-repairs.yml

      - name: Compile governance audits
        run: python -m compileall -q .github/scripts

      - name: Verify framework and repository governance locally
        env:
          PORTFOLIO_AUDIT_OUTPUT_DIR: ${{ runner.temp }}/deep-scan-local-verification
        run: |
          python .github/scripts/case_study_integrity_audit.py
          python .github/scripts/repo_governance_audit.py
          git diff --check

      - name: Write bounded reconciliation receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          ledger = json.loads((root / '.github/release-reconciliation.json').read_text(encoding='utf-8'))
          projects = {item['repository']: item for item in ledger['projects']}
          assert projects['media-tagger-bot']['reviewed_head_sha'] == '22fd78f6aa89e91c17cca3699af6602751d32b32'
          assert projects['net-loss-doctor']['reviewed_head_sha'] == '7008d3c5c65638d39ccc39569ece6b1b0d15df44'
          assert '92/92' in projects['media-tagger-bot']['note']
          assert 'caller CWD, Desktop, or OS temp' in projects['net-loss-doctor']['note']
          for relative in [
              '.github/scripts/reconcile_deep_scan_repairs.py',
              '.github/workflows/reconcile-deep-scan-repairs.yml',
          ]:
              assert not (root / relative).exists(), relative
          receipt = {
              'schema': 'gateway.deep_scan_reconciliation_receipt.v1',
              'generated_utc': ledger['generated_utc'],
              'media_tagger_head': projects['media-tagger-bot']['reviewed_head_sha'],
              'net_loss_doctor_head': projects['net-loss-doctor']['reviewed_head_sha'],
              'reviewed_public_project_count': ledger['reviewed_public_project_count'],
              'rights_notice': ledger['rights_notice'],
          }
          destination = Path(os.environ['RUNNER_TEMP']) / 'deep-scan-reconciliation-receipt.json'
          destination.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, ensure_ascii=False))
          PY

      - name: Upload bounded reconciliation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: deep-scan-reconciliation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deep-scan-reconciliation-receipt.json
            ${{ runner.temp }}/deep-scan-local-verification
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Commit only the verified reconciliation
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'The reconciliation produced no reviewable changes.' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Reconcile the v2.17.6 deep-scan repairs" \
            -m "Advance the exact MediaTaggerBot and NetLossDoctor source heads, correct test and managed-file claims, record the project-local-output repairs and honest runtime-identity boundary, and preserve every unrelated project version and blocker.\n\nCopyright © 2026 Gateway Information Group LLC. All rights reserved."
          git push origin HEAD:agent/reconcile-deep-scan-repairs-20260810

