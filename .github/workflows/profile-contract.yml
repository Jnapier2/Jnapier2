name: Portfolio health

on:
  push:
    paths:
      - README.md
      - RELEASE_RECONCILIATION.md
      - .github/portfolio-manifest.json
      - .github/release-reconciliation.json
      - .github/scripts/portfolio_audit.py
      - .github/scripts/portfolio_audit_html.py
      - .github/scripts/release_reconciliation_audit.py
      - .github/scripts/action_pin_audit.py
      - .github/workflows/profile-contract.yml
  pull_request:
    paths:
      - README.md
      - RELEASE_RECONCILIATION.md
      - .github/portfolio-manifest.json
      - .github/release-reconciliation.json
      - .github/scripts/portfolio_audit.py
      - .github/scripts/portfolio_audit_html.py
      - .github/scripts/release_reconciliation_audit.py
      - .github/scripts/action_pin_audit.py
      - .github/workflows/profile-contract.yml
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile audits
        run: >-
          python -m py_compile
          .github/scripts/portfolio_audit.py
          .github/scripts/portfolio_audit_html.py
          .github/scripts/release_reconciliation_audit.py
          .github/scripts/action_pin_audit.py

      - name: Audit profile, repositories, links, metadata, and pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/portfolio_audit_html.py

      - name: Audit represented and latest verified project versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_reconciliation_audit.py

      - name: Audit immutable GitHub Action references
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/action_pin_audit.py

      - name: Upload bounded audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: portfolio-health-${{ github.run_id }}
          path: audit-output
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  validate-image-dependency-pins:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Image Downloader candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jnapier2/image-downloader
          ref: d5970e901455a8690b157b49d2a911964f18f679
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact direct dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile exact candidate
        run: python -m compileall -q image_downloader.py tests
      - name: Run exact candidate test suite
        run: python -m unittest discover -s tests -v
      - name: Verify candidate identity
        run: >-
          python -c "import image_downloader as app; assert app.APP_VERSION == '2026.07.19.1'; print('Exact Image dependency candidate validation: PASS')"

