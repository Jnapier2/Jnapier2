name: Portfolio health

on:
  push:
    paths:
      - README.md
      - PROFILE_STRATEGY.md
      - LICENSE.md
      - SECURITY.md
      - RELEASE_RECONCILIATION.md
      - DEPENDENCY_RECONCILIATION.md
      - case-studies/reliable-project-delivery-framework/**
      - .github/CODEOWNERS
      - .github/portfolio-manifest.json
      - .github/release-reconciliation.json
      - .github/dependency-reconciliation.json
      - .github/dependabot-policy.json
      - .github/public-sanitization-allowlist.json
      - .github/scripts/portfolio_audit.py
      - .github/scripts/portfolio_audit_html.py
      - .github/scripts/profile_strategy_audit.py
      - .github/scripts/project_description_audit.py
      - .github/scripts/release_reconciliation_audit.py
      - .github/scripts/dependency_reconciliation_audit.py
      - .github/scripts/dependabot_policy_audit.py
      - .github/scripts/action_pin_audit.py
      - .github/scripts/public_sanitization_audit.py
      - .github/scripts/public_sanitization_runner.py
      - .github/scripts/public_github_surface_audit.py
      - .github/scripts/case_study_integrity_audit.py
      - .github/scripts/profile_repository_governance_audit.py
      - .github/workflows/profile-contract.yml
  pull_request:
    paths:
      - README.md
      - PROFILE_STRATEGY.md
      - LICENSE.md
      - SECURITY.md
      - RELEASE_RECONCILIATION.md
      - DEPENDENCY_RECONCILIATION.md
      - case-studies/reliable-project-delivery-framework/**
      - .github/CODEOWNERS
      - .github/portfolio-manifest.json
      - .github/release-reconciliation.json
      - .github/dependency-reconciliation.json
      - .github/dependabot-policy.json
      - .github/public-sanitization-allowlist.json
      - .github/scripts/portfolio_audit.py
      - .github/scripts/portfolio_audit_html.py
      - .github/scripts/profile_strategy_audit.py
      - .github/scripts/project_description_audit.py
      - .github/scripts/release_reconciliation_audit.py
      - .github/scripts/dependency_reconciliation_audit.py
      - .github/scripts/dependabot_policy_audit.py
      - .github/scripts/action_pin_audit.py
      - .github/scripts/public_sanitization_audit.py
      - .github/scripts/public_sanitization_runner.py
      - .github/scripts/public_github_surface_audit.py
      - .github/scripts/case_study_integrity_audit.py
      - .github/scripts/profile_repository_governance_audit.py
      - .github/workflows/profile-contract.yml
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile audits
        run: >-
          python -m py_compile
          .github/scripts/portfolio_audit.py
          .github/scripts/portfolio_audit_html.py
          .github/scripts/profile_strategy_audit.py
          .github/scripts/project_description_audit.py
          .github/scripts/release_reconciliation_audit.py
          .github/scripts/dependency_reconciliation_audit.py
          .github/scripts/dependabot_policy_audit.py
          .github/scripts/action_pin_audit.py
          .github/scripts/public_sanitization_audit.py
          .github/scripts/public_sanitization_runner.py
          .github/scripts/public_github_surface_audit.py
          .github/scripts/case_study_integrity_audit.py
          .github/scripts/profile_repository_governance_audit.py

      - name: Audit profile, repositories, links, metadata, and pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/portfolio_audit_html.py

      - name: Audit canonical project descriptions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/project_description_audit.py

      - name: Audit benchmarked profile strategy
        run: python .github/scripts/profile_strategy_audit.py

      - name: Audit represented and latest verified project versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_reconciliation_audit.py

      - name: Audit dependency and installation contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/dependency_reconciliation_audit.py

      - name: Audit per-ecosystem Dependabot policy and auto-merge prohibition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/dependabot_policy_audit.py

      - name: Audit immutable GitHub Action references
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/action_pin_audit.py

      - name: Verify profile repository governance
        run: python .github/scripts/profile_repository_governance_audit.py

      - name: Verify Reliable Project Delivery Framework release
        run: python .github/scripts/case_study_integrity_audit.py

      - name: Audit public content, privacy, and release sanitation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/public_sanitization_runner.py

      - name: Audit open issues, pull requests, releases, and asset names
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/public_github_surface_audit.py

      - name: Upload bounded audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: portfolio-health-${{ github.run_id }}
          path: audit-output
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

