name: Portfolio health

on:
  push:
    paths:
      - README.md
      - .github/portfolio-manifest.json
      - .github/scripts/portfolio_audit.py
      - .github/workflows/profile-contract.yml
  pull_request:
    paths:
      - README.md
      - .github/portfolio-manifest.json
      - .github/scripts/portfolio_audit.py
      - .github/workflows/profile-contract.yml
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile audit
        run: python -m py_compile .github/scripts/portfolio_audit.py

      - name: Audit profile, repositories, links, metadata, and pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/portfolio_audit.py

